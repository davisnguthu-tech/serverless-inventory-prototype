<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northstar Retail - Inventory Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 2rem;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            color: #60a5fa;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid #334155;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background: #2563eb;
        }

        .preset {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .preset button {
            flex: 1;
            background: #334155;
            font-size: 0.85rem;
            padding: 0.5rem;
        }

        #result {
            display: none;
        }

        .product-card {
            background: #1e293b;
            border-left: 4px solid #3b82f6;
            padding: 1.5rem;
            border-radius: 8px;
        }

        .product-card.out {
            border-left-color: #ef4444;
        }

        .product-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: #60a5fa;
        }

        .stock {
            font-size: 2rem;
            font-weight: 700;
            margin: 0.5rem 0;
        }

        .in {
            color: #22c55e;
        }

        .out {
            color: #ef4444;
        }

        .error {
            background: #7f1d1d;
            border-left: 4px solid #ef4444;
            padding: 1rem;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Northstar Retail</h1>
        <p class="subtitle">Serverless Inventory Prototype</p>

        <div class="card">
            <h2>Query Inventory API</h2>
            <input type="text" id="productId" placeholder="Enter Product ID e.g. PROD-101">
            <button onclick="checkInventory()">Send Request</button>
            <div class="preset">
                <button onclick="quickTest('PROD-101')">PROD-101 (In Stock)</button>
                <button onclick="quickTest('PROD-103')">PROD-103 (Out of Stock)</button>
                <button onclick="quickTest('PROD-999')">PROD-999 (404)</button>
            </div>
        </div>

        <div id="result"></div>
    </div>

    <script>
        async function checkInventory(id = null) {
            const productId = id || document.getElementById('productId').value;
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';

            try {
                const res = await fetch(`/api/inventory?productId=${productId}`);
                const data = await res.json();

                if (!res.ok) {
                    resultDiv.innerHTML = `<div class="error"><b>Error ${res.status}</b><p>${data.error}</p></div>`;
                    return;
                }

                const statusClass = data.inStock ? 'in' : 'out';
                const statusText = data.inStock ? '✅ In Stock' : '❌ Out of Stock';

                resultDiv.innerHTML = `
                    <div class="product-card ${!data.inStock ? 'out' : ''}">
                        <div class="product-name">${data.productName}</div>
                        <div>Product ID: ${data.productId}</div>
                        <div class="stock ${statusClass}">${data.stock} units</div>
                        <div>${statusText}</div>
                    </div>
                `;
            } catch (e) {
                resultDiv.innerHTML = `<div class="error"><b>Network Error</b></div>`;
            }
        }
        function quickTest(id) {
            document.getElementById('productId').value = id;
            checkInventory(id);
        }
    </script>
</body>

</html>
